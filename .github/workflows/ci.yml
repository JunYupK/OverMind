name: CI

on:
  pull_request:
  push:
    branches: [master]
  schedule:
    # 매일 03:00 KST (18:00 UTC) — L3 평가
    - cron: '0 18 * * *'
  workflow_dispatch:

jobs:
  verify:
    name: verify (기계 게이트)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # compile + L1 + ArchUnit + L2(Testcontainers). ubuntu 러너에는 Docker가 있다.
      - run: ./gradlew verify

  guardrails:
    name: guardrails
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # PR이면 base 브랜치와, push면 직전 커밋과 비교한다.
      - name: guardrail 검사
        run: |
          if [ -n "${{ github.base_ref }}" ]; then
            BASE="origin/${{ github.base_ref }}"
          else
            BASE="HEAD~1"
          fi
          echo "base ref = $BASE"

          # LogUpdatedGuardTest는 baseRef를 해석할 수 없으면 실패가 아니라 스킵한다.
          # 얕은 체크아웃이나 브랜치 첫 커밋에서 BASE가 풀리지 않으면 이 가드가
          # 조용히 꺼진 채로 CI가 초록이 되는 구멍이 생긴다. Gradle 쪽 skip 가시화로는
          # 막을 수 없으니, Gradle을 부르기 전에 CI에서 먼저 검증해서 명시적으로 막는다.
          if ! git rev-parse --verify "$BASE" >/dev/null 2>&1; then
            echo "::error::guardrail base ref '$BASE' resolves to nothing (shallow checkout, or a first commit with no HEAD~1). LogUpdatedGuardTest would silently skip instead of failing — refusing to proceed."
            exit 1
          fi

          ./gradlew guardrailTest -PbaseRef="$BASE"

  publish:
    name: publish (GHCR 이미지)
    # 게이트를 통과한 커밋만 이미지가 된다. 이 needs가 D-H의 전제 전부다.
    needs: [verify, guardrails]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - run: ./gradlew bootJar

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # 레포가 public이라 박스는 익명으로 pull한다. PAT를 심을 필요가 없다.
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          # 박스가 aarch64다. Dockerfile에 RUN이 없어서 에뮬레이션 없이 만들어진다.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/junyupk/overmind:${{ github.sha }}
            ghcr.io/junyupk/overmind:latest

  evaluation:
    name: evaluation (L3)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # 실제 LLM을 호출한다. 비용이 발생하므로 PR을 막지 않는다.
      - run: ./gradlew evaluationTest
        env:
          OVERMIND_LLM_API_KEY: ${{ secrets.OVERMIND_LLM_API_KEY }}
